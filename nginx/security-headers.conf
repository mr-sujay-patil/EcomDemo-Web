# Included by every location (nginx drops the server's add_header lines in a location that has one of its own, so
# repeating the include is the only way every response, 404s and proxied answers included, carries all of them).
# `always` adds them to error responses too. Why each value: docs/security.md and docs/decisions.md [Phase 22].

# The browser may load code, styles, fonts, images and make requests only from this origin: the page's own (product photos
# come from /api/products/{id}/image, so 'self' covers them; the build has no data: image, so none is allowed). No
# 'unsafe-inline', no 'unsafe-eval'. One inline script is allowed by the sha256 of its exact text: index.html's early product
# request (web KI-027). Any other inline script, or this one changed by a single byte, is blocked; `npm run verify`
# (scripts/check-dist.mjs) fails when the hash here and the script in the build disagree, and prints the one to put here.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-ZiIPqcuU5tkNrvdpv9EcIfBThMdFkSaudoamG/Lf9MU='; style-src 'self'; img-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# Only the origin (never the path or query) goes in a Referer to another site.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# A file is used as the type it was sent as: no sniffing a text file into a script.
add_header X-Content-Type-Options "nosniff" always;
# The shop uses none of these powerful features, so the page (and anything in it) may not ask for them.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
# A window opened from another site cannot reach this one through window.opener.
add_header Cross-Origin-Opener-Policy "same-origin" always;
