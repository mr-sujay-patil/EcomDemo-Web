# Included by every location (nginx drops the server's add_header lines in a location that has one of its own, so
# repeating the include is the only way every response, 404s and proxied answers included, carries all of them).
# `always` adds them to error responses too. Why each value: docs/security.md and docs/decisions.md [Phase 22].

# The browser may load code, styles, fonts, images and make requests only from this origin: the page's own. `data:` images
# are allowed for the few inline SVG/PNG placeholders; nothing else is. No 'unsafe-inline', no 'unsafe-eval'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# Only the origin (never the path or query) goes in a Referer to another site.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# A file is used as the type it was sent as: no sniffing a text file into a script.
add_header X-Content-Type-Options "nosniff" always;
# The shop uses none of these powerful features, so the page (and anything in it) may not ask for them.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
# A window opened from another site cannot reach this one through window.opener.
add_header Cross-Origin-Opener-Policy "same-origin" always;
