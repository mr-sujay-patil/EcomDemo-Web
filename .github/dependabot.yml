# Dependabot opens PRs for new releases; CI checks each one like any other PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # One PR a week for everything that should be safe; each major version gets a PR of its own.
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Held back on purpose (docs/decisions.md, Phase 4): typescript-eslint 8 supports TypeScript < 6.1
      # and eslint-plugin-jsx-a11y declares ESLint <= 9. Remove these when the plugins catch up.
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: '@eslint/js'
        update-types: [version-update:semver-major]
      # Held back on purpose (docs/decisions.md, chore 2026-11-04): OpenTelemetry's 3.0 release is split.
      # instrumentation 0.300 requires @opentelemetry/api >=1.10, but the newest stable sdk-trace-web (2.12)
      # still requires api <1.10, and its 3.x is a canary only; together they fail `npm ci` (Dependabot PR #60).
      # The three move together: remove these when a stable sdk-trace-web 3.x accepts api 1.10. Patches still come.
      - dependency-name: '@opentelemetry/api'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: '@opentelemetry/instrumentation'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: '@opentelemetry/instrumentation-fetch'
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Dependabot updates both the pinned SHA and the version comment beside it.
    groups:
      github-actions:
        patterns: ['*']
