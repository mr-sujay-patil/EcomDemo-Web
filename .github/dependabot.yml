# Dependabot opens PRs for new releases; CI checks each one like any other PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # One PR a week for everything that should be safe; each major version gets a PR of its own.
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Held back on purpose (docs/decisions.md, Phase 4): typescript-eslint 8 supports TypeScript < 6.1
      # and eslint-plugin-jsx-a11y declares ESLint <= 9. Remove these when the plugins catch up.
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: '@eslint/js'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Dependabot updates both the pinned SHA and the version comment beside it.
    groups:
      github-actions:
        patterns: ['*']
