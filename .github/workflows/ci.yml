# Continuous integration: every pull request, and every push to main (which only ever happens
# through a merged PR), must pass both jobs. From Phase 5 on, nothing is merged red.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# The GITHUB_TOKEN gets nothing by default; each job asks for the least it needs.
permissions: {}

# A newer push to the same PR makes the running check stale, so cancel it. Runs on main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `verify` and `e2e` run on pull requests only. On a push to main they would test the tree the pull request already
  # tested: branch protection requires a branch to be up to date with main before it merges, so the commit that lands on main
  # has the same tree as the PR run that went green. Needs "Require branches to be up to date before merging" and "Do not
  # allow bypassing the above settings" on main (repository settings, turned on by the owner). `image` still runs on every push, and
  # `publish` below is gated on all three.
  verify:
    name: verify
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Actions are pinned by commit SHA: a tag can be moved to other code, a SHA cannot.
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      # The same gate as on a laptop: typecheck, lint, format check, unit tests (with coverage, once: this writes coverage/), build.
      - name: Verify
        run: npm run verify

      # Fails on a HIGH or CRITICAL advisory in any dependency (dev tools included) unless audit-allowlist.json accepts it with a
      # reason and an expiry date. Needs the registry, so it can also fail on a day a new advisory is published: that is the point.
      - name: Audit the dependencies
        run: npm run audit:deps

      - name: Upload the coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  e2e:
    name: e2e
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    # Building eight backend images from source is most of this; see docs/test-reports/phase-05.md.
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # The backend this app is tested against: a commit of its `main` (tagged `ki-049-fixed`), pinned by SHA because a tag can be moved.
      # The name stays BACKEND_TAG; any ref works. Override with a repository variable when the pin moves.
      BACKEND_TAG: ${{ vars.BACKEND_TAG || '82ef5989594c30330850594f388967b8f080ce8a' }}
    steps:
      # The same side-by-side layout as a laptop, so e2e/global-setup.ts finds ../ecomdemo-backend-readonly.
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: web
          persist-credentials: false

      - name: Check out the backend at ${{ env.BACKEND_TAG }} (read only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mr-sujay-patil/ecomdemo
          ref: ${{ env.BACKEND_TAG }}
          path: ecomdemo-backend-readonly
          persist-credentials: false

      # A throwaway signing key for this run only: nothing secret comes from this repository.
      - name: Write the backend's .env
        working-directory: ecomdemo-backend-readonly
        run: |
          cp .env.example .env
          # Phase 33 (tag phase-33-complete): one RSA signing key and three client secrets, all generated
          # here and masked. An older tag ignores them and still reads JWT_SECRET.
          key="$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null | openssl pkcs8 -topk8 -nocrypt -outform DER | base64 -w0)"
          echo "::add-mask::$key"
          sed -i "s|^JWT_SIGNING_KEY=.*|JWT_SIGNING_KEY=$key|" .env
          for name in GATEWAY APP CATALOG; do
            secret="$(openssl rand -hex 32)"
            echo "::add-mask::$secret"
            sed -i "s|^${name}_CLIENT_SECRET=.*|${name}_CLIENT_SECRET=$secret|" .env
          done
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$secret|" .env
          # Since backend KI-050 Redis requires a password and compose refuses to start without one (no default).
          secret="$(openssl rand -hex 16)"
          echo "::add-mask::$secret"
          sed -i "s|^REDIS_PASSWORD=.*|REDIS_PASSWORD=$secret|" .env

      # The backend publishes no per-service images to GHCR yet (web KI-015). Building eight of them from source took ~200 s,
      # so a tarball of the built images is cached per backend commit. Only .github/workflows/backend-images.yml saves it
      # (on main, daily and by hand): a cache saved by a pull request is visible to that pull request alone.
      - name: Find the backend commit
        id: backend
        run: echo "sha=$(git -C ecomdemo-backend-readonly rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore the backend images
        id: backend-images
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend-images.tar
          key: backend-images-${{ steps.backend.outputs.sha }}

      # A hit: load the tarball and start without building. A miss: build and start as before (slower, same result).
      - name: Load the cached backend images and start the stack
        if: ${{ steps.backend-images.outputs.cache-hit == 'true' }}
        working-directory: ecomdemo-backend-readonly
        run: |
          docker load --input ../backend-images.tar
          docker compose up --wait --wait-timeout 600

      - name: Build and start the backend stack (no cached images)
        if: ${{ steps.backend-images.outputs.cache-hit != 'true' }}
        working-directory: ecomdemo-backend-readonly
        run: |
          echo "::notice::No cached backend images for ${{ steps.backend.outputs.sha }}: building. Run the 'Backend images' workflow to cache them."
          docker compose up --build --wait --wait-timeout 600

      # Printed to the log and to the run's summary page: does the stack still fit a hosted runner?
      - name: Record the stack's footprint
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Backend stack on the runner ($BACKEND_TAG)"
            echo '```'
            nproc | sed 's/^/vCPUs: /'
            free -m
            docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install exact dependencies
        working-directory: web
        run: npm ci

      # The browser download is cached by Playwright version; `install --with-deps` still runs, because the system libraries
      # (apt) are not part of the cache. With the browser present it only installs those. Like every cache saved from a pull
      # request, it is visible to that pull request only (so it helps a re-run, not a new PR).
      - name: Find the Playwright version
        id: playwright
        working-directory: web
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium for Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end suite
        working-directory: web
        run: npm run e2e

      # The budgets (docs/performance.md): Lighthouse CI on the production image for the shelf and a product page, and the signed-in
      # cart and order flows, against the backend this job already started. A broken budget fails the job. `npm run perf` builds the
      # image, starts only `web`, and takes it down again.
      - name: Check the performance budgets
        working-directory: web
        run: npm run perf

      # The bundle's treemap and its raw numbers, as an artifact to read (rollup-plugin-visualizer is a dev dependency, not in the app).
      - name: Analyse the bundle
        if: ${{ always() }}
        working-directory: web
        run: npm run perf:analyze

      - name: Upload the performance results and the bundle analysis
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance
          path: |
            web/perf-results/
            web/.lighthouseci/
            web/bundle-analysis/
          if-no-files-found: ignore
          retention-days: 14

      # Traces are recorded on the first retry (playwright.config.ts), so a failure always has one.
      - name: Upload the Playwright report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14

      - name: Save the backend logs
        if: ${{ failure() }}
        working-directory: ecomdemo-backend-readonly
        run: |
          docker compose ps --all > ../backend-logs.txt
          docker compose logs --no-color --timestamps >> ../backend-logs.txt

      - name: Upload the backend logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-logs
          path: backend-logs.txt
          retention-days: 14

  # The web container (Dockerfile, nginx/default.conf.template). Built on every pull request, and started once to prove it
  # serves: a build that cannot start is caught here, not after a merge. The cache makes the publish job's rebuild a copy.
  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ecomdemo-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No backend here: nginx resolves the gateway when a request arrives, so it starts without one. This proves the
      # image starts as its non-root user on a read-only filesystem, is healthy, and serves the app and a deep link.
      - name: Start it and check it serves
        run: |
          docker run -d --name web --read-only --tmpfs /tmp --tmpfs /var/cache/nginx:uid=101,gid=101 \
            --tmpfs /etc/nginx/conf.d:uid=101,gid=101 --cap-drop ALL -p 8070:8080 ecomdemo-web:ci
          for attempt in $(seq 1 30); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' web)" = healthy ] && break
            sleep 2
          done
          docker inspect --format 'health={{.State.Health.Status}} user={{.Config.User}}' web
          docker image inspect --format 'size={{.Size}} bytes' ecomdemo-web:ci
          test "$(docker inspect --format '{{.State.Health.Status}}' web)" = healthy
          curl --fail --silent --show-error http://localhost:8070/healthz
          curl --fail --silent --show-error http://localhost:8070/products/1 | grep -q '<div id="root">'
          # The security headers (docs/security.md); the E2E suite against the container checks them on more paths.
          headers="$(curl --silent --show-error --head http://localhost:8070/)"
          for header in Content-Security-Policy Referrer-Policy X-Content-Type-Options Permissions-Policy Cross-Origin-Opener-Policy; do
            echo "$headers" | grep -qi "^$header:" || { echo "missing header: $header"; exit 1; }
          done
          echo "$headers" | grep -qi "^content-security-policy:.*script-src 'self';"
          docker rm --force web

      # web KI-035: against a stand-in HTTPS gateway, nginx proxies only when the certificate chains to API_CA_FILE and names
      # the upstream (a wrong CA and a wrong name are both 502), and a plain http:// gateway (compose) works as before.
      - name: Check nginx verifies an HTTPS gateway
        run: bash scripts/test-nginx-upstream-tls.sh ecomdemo-web:ci

      # The software bill of materials: every package in the image (Alpine and nginx's, and the app's files) in CycloneDX.
      # Made before the scan and uploaded even when the scan fails, so the list is there to read when something is flagged.
      - name: Make the SBOM of the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ecomdemo-web:ci
          version: v0.75.0
          format: cyclonedx
          output: sbom.cdx.json

      - name: Upload the SBOM
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

      # HIGH and CRITICAL findings that have a fix available fail the job (a finding with no fix yet cannot be acted on).
      # .trivyignore.yaml accepts one, with a written statement and an expiry date.
      - name: Scan the image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ecomdemo-web:ci
          version: v0.75.0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore.yaml

  # Publishes the image, only for a merge to main and only after every check above passed.
  publish:
    name: publish
    needs: [verify, e2e, image]
    # verify and e2e are skipped on a push to main (they ran on the pull request), so "skipped" counts as passed here; a
    # failure or a cancellation does not. `always()` is needed because a skipped dependency would otherwise skip this job too.
    if: >-
      ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.image.result == 'success'
      && (needs.verify.result == 'success' || needs.verify.result == 'skipped')
      && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image name is lower-cased for us (the repository name has capitals, a registry name may not).
      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
