# The web container, beside the backend. This file starts ONE service, `web`. It never starts, stops or changes a
# backend service and never edits the backend's compose file: it only joins the network the backend's stack made.
#
#   docker compose up --build --wait     the shop on http://localhost:${WEB_PORT:-8070}  (the backend stack must be up)
#   docker compose down                  stops `web` only
#
# The backend's network is called <its compose project>_default. Its project is its folder's name, so it is
# `ecomdemo_default` for the backend team's checkout (~/projects/ecomdemo) and `ecomdemo-backend-readonly_default` for the
# read-only clone this repository's docs use. Set BACKEND_NETWORK to the one that is running: `docker network ls`.
name: ecomdemo-web

services:
  web:
    build: .
    image: ecomdemo-web:local
    container_name: ecomdemo-web
    ports:
      # Loopback only: the app is for this machine until a deployment says otherwise.
      - "127.0.0.1:${WEB_PORT:-8070}:8080"
    environment:
      # The gateway's compose service name and port (backend compose.yaml: gateway-service, 8080).
      API_UPSTREAM: ${API_UPSTREAM:-http://gateway-service:8080}
    networks:
      - backend
    read_only: true
    tmpfs:
      # nginx needs somewhere to write: its pid, temp files and the config the entrypoint renders at start.
      - /tmp
      - /var/cache/nginx:uid=101,gid=101
      - /etc/nginx/conf.d:uid=101,gid=101
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  backend:
    # Made by the backend's stack, not by this file: external, so `down` here never removes it.
    external: true
    name: ${BACKEND_NETWORK:-ecomdemo_default}
