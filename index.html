<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>EcomDemo</title>
    <!-- Two faces are preloaded: the headings and the body text. The rest load when a page uses them. -->
    <link rel="preload" href="/src/styles/fonts/Newsreader-SemiBold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/styles/fonts/IBMPlexSans-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Applies a saved Light or Dark choice before the first paint, so the page does not flash the other theme. Same key as src/app/useTheme.ts. -->
    <script>
      try {
        var theme = localStorage.getItem('ecomdemo-theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
