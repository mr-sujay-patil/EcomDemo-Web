<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- The shelf (/) and a product page loaded cold ask for their data here, before the app's JavaScript has downloaded (the shelf: the catalogue's first page, the same GET as src/features/catalog/products.ts, web KI-042); a product page also preloads the photo the answer names: the photo is the page's largest paint and was the end of a chain (page, script, data, photo). The app takes this request instead of asking again (src/api/earlyRequest.ts). Inline and first in <head>, so it starts with the page: after a parser-blocking script (theme-init.js) it would wait for that file, which shares the slow link with all the JavaScript and CSS (measured: the request then started after them); the Content-Security-Policy allows exactly this text by its sha256 hash (nginx/security-headers.conf, checked by scripts/check-dist.mjs). Web KI-027, docs/performance.md. -->
    <script>
      ;(function () {
        var shelf = location.pathname === '/'
        var id = /^\/products\/([1-9]\d{0,15})\/?$/.exec(location.pathname)
        if ((!shelf && !id) || !window.fetch) return
        var path = shelf ? '/api/products?page=0&size=100' : '/api/products/' + id[1]
        var correlationId = window.crypto && crypto.randomUUID ? crypto.randomUUID() : null
        var headers = { Accept: 'application/json' }
        if (correlationId) headers['X-Correlation-Id'] = correlationId
        var response = fetch(path, { headers: headers })
        window.__ecomdemoEarly = { path: path, correlationId: correlationId, response: response }
        response
          .then(function (answer) {
            return answer.ok && !shelf ? answer.clone().json() : null
          })
          .then(function (product) {
            var photo = product && product.imageUrl
            if (typeof photo !== 'string' || !/^\/(?!\/)/.test(photo)) return
            var link = document.createElement('link')
            link.rel = 'preload'
            link.setAttribute('as', 'image')
            link.href = photo
            link.setAttribute('fetchpriority', 'high')
            document.head.appendChild(link)
          })
          .catch(function () {})
      })()
    </script>
    <title>EcomDemo</title>
    <!-- Two faces are preloaded: the headings (Newsreader 600) and the body text (IBM Plex Sans 400: the shelf's product descriptions, its largest paint). A face that is not preloaded is asked for only once React has drawn text in it, and Lighthouse's simulation counts a font that arrives before the largest paint at its slow-link time, after all the JavaScript (web KI-043). The other five faces load when a page uses them: preloading more took the slow link from the JavaScript and the product photo (docs/performance.md). Vite rewrites each href to the hashed file it emits; npm run verify (scripts/check-dist.mjs) checks that. -->
    <link rel="preload" href="/src/styles/fonts/Newsreader-SemiBold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/styles/fonts/IBMPlexSans-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Applies a saved Light or Dark choice before the first paint (public/theme-init.js). A file, not inline code: the Content-Security-Policy allows an inline script only by its hash, and this one has no reason to need that exception. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
