# What SonarQube analyses, and how (Phase 25, web KI-014). Read by the scanner that `npm run sonar` runs
# (scripts/sonar-scan.sh); the server, its project and its quality gate come from compose.sonar.yaml and
# scripts/sonar-setup.sh. Nothing secret belongs here: the token comes from the SONAR_TOKEN environment variable.

sonar.projectKey=ecomdemo-web
sonar.projectName=EcomDemo Web
sonar.sourceEncoding=UTF-8

# The app is src/. The tests live beside the code they test, so src/ is also the test root: a file is either a source or
# a test, never both, so the test files are excluded from the sources and included as tests. SonarQube then applies its
# test rules to them and never counts them as code that needs covering.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**
# Not analysed at all: the types generated from the backend's OpenAPI documents (`npm run api:generate`, never hand-edited:
# an issue in them could only be fixed by regenerating) and, as above, the tests.
sonar.exclusions=src/api/generated/**,src/**/*.test.ts,src/**/*.test.tsx,src/test/**

# Coverage is not measured by SonarQube: it imports the report Vitest writes (`npm run test:coverage`, the lcov reporter
# in vite.config.ts). Run the tests first, or the analysis has no coverage. src/main.tsx only mounts the app, and
# vite.config.ts leaves it out of coverage for that reason; the same file is left out here so both numbers mean the same.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.tsx

# The TypeScript program the analyser type-checks with: the app's own config (strict, the `@/` alias, src/ only).
sonar.typescript.tsconfigPaths=tsconfig.app.json

# Wait for the server to apply the quality gate and fail when it fails, instead of printing a link nobody opens.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Findings accepted on purpose (web KI-038, `[Fix KI-038]` in docs/decisions.md). Kept here, in Git, rather than marked
# "Accepted" in the server: a resolution stored in SonarQube's database is lost when the server is rebuilt and is never
# seen in a review (the backend's Phase 12 found the same). TypeScript has no rule-specific suppression in the code
# (`// NOSONAR` silences every rule on the line), so each entry names ONE rule and the narrowest files it applies to,
# with the reason above it. Remove an entry and the rule speaks again. scripts/sonar.test.ts checks every entry has a
# reason and is one of the rules decided on.
sonar.issue.ignore.multicriteria=liveregion,ownertodo,previewrow

# typescript:S6819 "use <output>/<img>/<fieldset> instead of the role". role="status" is this app's loading and result
# message ([Phase 08], checked by axe in Phase 18): it sits on <p>/<div>/<span> holding sentences, which <output> may not
# hold (phrasing content only), and <output> is meant for the result of a calculation; announcing changes to it is
# less consistently supported by screen readers than role="status". Icon is an inline <svg role="img" aria-label>,
# which an <img alt> cannot be without losing currentColor. QuantityStepper and the shelf's category chips are
# role="group" with aria-label: a <fieldset> would need a visible <legend> and adds form chrome, for the same semantics.
sonar.issue.ignore.multicriteria.liveregion.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.liveregion.resourceKey=src/**/*.tsx

# typescript:S1135 "complete the TODO". The TODO(owner) placeholders in src/content/ are words only the owner may write
# (CLAUDE.md hard rule 11: never invent human content); they are listed in every Phase Review Report until filled in.
sonar.issue.ignore.multicriteria.ownertodo.ruleKey=typescript:S1135
sonar.issue.ignore.multicriteria.ownertodo.resourceKey=src/content/**

# typescript:S6479 "do not use the array index as a key". The import preview's rows are lines of a CSV file: they have
# no id, two lines can be identical, and the table is replaced whole when another file is chosen, so the line number
# (the index) is the row's real, stable identity.
sonar.issue.ignore.multicriteria.previewrow.ruleKey=typescript:S6479
sonar.issue.ignore.multicriteria.previewrow.resourceKey=src/features/admin/ImportPage.tsx
